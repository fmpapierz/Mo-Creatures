plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    runs {
        clientDebug {
            client()
            ideConfigGenerated true
            name = "NeoForge Client"
            source sourceSets.main
            property 'mixin.debug', 'true'
            property "fabric.log.level", "debug"
        }

        serverDebug {
            server()
            ideConfigGenerated true
            name = "NeoForge Server"
            source sourceSets.main
            property 'mixin.debug', 'true'
            property "fabric.log.level", "debug"
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    shadowCommon {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:$neoforge_version"

    // Architectury API (NeoForge platform implementation).
    api "dev.architectury:architectury-neoforge:$architectury_api_version"

    common(project(path: ":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge"))
}

// Minecraft 26.1 is unobfuscated, so Loom no longer produces a remapJar.
// The shadowJar (common classes merged into the platform jar) is the final artifact.
shadowJar {
    exclude "architectury.common.json"
    exclude "architectury_inject*/**"
    exclude "fabric.mod.json"

    // NeoForge's own resources are added first (from the platform jar) and take precedence over the
    // shadowed common ones, so a NeoForge-only override (e.g. the dimension_type carrying the
    // neoforge:custom_skybox attribute, which Fabric can't parse) wins over the common copy.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowCommon]
    archiveAppendix = project.name
    archiveClassifier = null
}

jar {
    archiveClassifier = "raw"
}

assemble.dependsOn shadowJar

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

sourcesJar {
    // The NeoForge dimension_type override duplicates the common one; keep the platform copy.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    addVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {}
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
