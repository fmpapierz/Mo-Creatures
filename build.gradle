plugins {
    id "dev.architectury.loom-no-remap" version "1.14-SNAPSHOT" apply false
    id "architectury-plugin" version "3.5-SNAPSHOT"
    id "com.gradleup.shadow" version "9.4.2" apply false
}

architectury.minecraft = minecraft_version

Map<String, String> modProperties() {
    [
            version: mod_version, mod_id: mod_id, description: project.properties.description,
            github_repo: 'https://github.com/' + github, display_name: display_name,
    ]
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper

subprojects {
    apply plugin: "dev.architectury.loom-no-remap"
    apply plugin: "architectury-plugin"

    repositories {
        maven { url "https://maven.neoforged.net/releases/" }
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
    }

    dependencies {
        // Minecraft 26.x ships unobfuscated, so no mappings are needed (and Loom no longer remaps).
        minecraft "com.mojang:minecraft:$minecraft_version"
    }

    processResources {
        def properties = modProperties()
        inputs.properties properties

        filesMatching(["META-INF/*mods.toml", "fabric.mod.json", "pack.mcmeta"]) {
            expand properties
            filter { it.empty ? null : it }
        }

        doLast {
            fileTree(dir: outputs.files.asPath, includes: ["**/*.json", "**/*.mcmeta"]).each {
                it.text = JsonOutput.toJson(new JsonSlurper().parse(it))
            }
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "maven-publish"

    base.archivesName = mod_id

    version = mod_version + "+" + minecraft_version
    group = maven_group

    repositories {
        exclusiveContent {
            forRepositories maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 25
    }

    java.withSourcesJar()

    // rootProject.file, not 'LICENSE': inside allprojects a bare path resolves per-project,
    // so the subprojects looked for fabric/LICENSE etc. and silently shipped no licence at all.
    // GPL-3.0 requires the licence text to travel with the binary.
    // EXCLUDE because the platform sourcesJars also inherit common's copy of this same file.
    [jar, sourcesJar]*.configure {
        from(rootProject.file('LICENSE')) {
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }
    }
}

// ============================================================================================
// Each loader's RELEASE jar (the shadow jar mocreatures-<loader>-<version>.jar, no classifier) is mirrored
// into the root build/libs after every assemble. The pre-shadow -raw jar and the -sources jar stay in the
// module folders. The root project has no sources of its own, so its empty jars are switched off: they
// would land in the same folder the Sync owns.
// ============================================================================================
def loaderModules = ['fabric', 'neoforge'].collect { project(":$it") }

tasks.named('jar') { enabled = false }
tasks.named('sourcesJar') { enabled = false }

def collectJars = tasks.register('collectJars', Sync) {
    group = 'build'
    description = "Mirrors every loader module's release jar into the root build/libs"
    loaderModules.each { sp ->
        from(sp.layout.buildDirectory.dir('libs')) {
            include '*.jar'
            exclude '*-sources.jar', '*-javadoc.jar', '*-dev.jar', '*-dev-shadow.jar', '*-thin.jar', '*-slim.jar', '*-api.jar', '*-raw.jar'
        }
        // Ordering only (never a dependency): :fabric:assemble must not drag :neoforge along.
        mustRunAfter sp.tasks.withType(Jar)
        mustRunAfter sp.tasks.matching { it.name == 'assemble' }
    }
    into layout.buildDirectory.dir('libs')
    doLast {
        logger.lifecycle("[collectJars] root build/libs now holds:")
        destinationDir.listFiles()?.sort()?.each { logger.lifecycle("[collectJars]   " + it.name) }
    }
}

loaderModules.each { sp ->
    sp.tasks.matching { it.name == 'assemble' }.configureEach { finalizedBy collectJars }
}
