org.gradle.jvmargs=-Xmx6G
org.gradle.daemon=false

# Gradle itself must run on JDK 25 (Minecraft 26.x requirement; enforced in settings.gradle).
# Pinned to the local JDK 25 so `gradlew` works regardless of your default `java`.
# (Remove or repoint this line if you move the JDK or share the project.)
org.gradle.java.home=C:/Users/warwa/.gradle/jdks/eclipse_adoptium-25-amd64-windows.2

minecraft_version=26.2
enabled_platforms=fabric,neoforge

mod_id=mocreatures
mod_version=26.2.0
maven_group=drzhark.mocreatures
description=DrZhark's Mo'Creatures — adds 46 new creatures with taming, breeding, riding, the Wyvern Lair dimension and more.
github=fmpapierz/Mo-Creatures
display_name=DrZhark's Mo'Creatures

fabric_loader_version=0.19.3
fabric_api_version=0.153.0+26.2

neoforge_version=26.2.0.7-beta

# Architectury API (the 21.0.2 build targets Minecraft 26.2)
architectury_api_version=21.0.2

# Minecraft 26.x is unobfuscated, so Loom no longer needs/uses mappings.
# This silences the dependency Loom version validation for the no-remap variant.
loom.ignoreDependencyLoomVersionValidation=true
