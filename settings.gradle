pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.neoforged.net/releases/" }
        gradlePluginPortal()
    }
}

if (JavaVersion.current().ordinal() + 1 < 25) {
    throw new IllegalStateException("Minecraft 26.1 requires Java 25+! Please run Gradle with a Java 25 (or newer) JVM.")
}

include("common")
include("fabric")
include("neoforge")

rootProject.name = mod_id
